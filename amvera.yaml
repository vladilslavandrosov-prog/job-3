meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: |
    npm run build
    cp -r public .next/standalone/public
    cp -r .next/static .next/standalone/.next/static
  artifacts:
    - .next/standalone

run:
  scriptName: node
  args: .next/standalone/server.js
  containerPort: 3000
  persistenceMount: /data
