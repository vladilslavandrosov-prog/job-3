meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: npm run build
  artifacts:
    - .next
    - public
    - node_modules
    - package.json
    - next.config.ts

run:
  scriptName: node_modules/.bin/next
  args: start
  containerPort: 3000
  persistenceMount: /data
